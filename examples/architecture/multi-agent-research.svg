<svg xmlns="http://www.w3.org/2000/svg" width="448" height="932" viewBox="0 0 448 932" role="img">
<title>Multi-Agent Research Workflow</title>
<desc>A directed workflow from planning through evidence review and synthesis.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs>
<rect width="448" height="932" fill="#FFFFFF"/>
<text x="52" y="64" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">Multi-Agent Research Workflow</text>
<path d="M 224.0 174.0 V 222.0 H 224.0 V 265.0" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="224.0" y="215.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B" stroke="#FFFFFF" stroke-width="4" paint-order="stroke fill">research plan</text>
<path d="M 224.0 348.0 V 396.0 H 224.0 V 439.0" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="224.0" y="389.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B" stroke="#FFFFFF" stroke-width="4" paint-order="stroke fill">evidence</text>
<path d="M 224.0 522.0 V 570.0 H 224.0 V 613.0" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="224.0" y="563.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B" stroke="#FFFFFF" stroke-width="4" paint-order="stroke fill">reviewed evidence</text>
<path d="M 224.0 696.0 V 744.0 H 224.0 V 787.0" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="224.0" y="737.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B" stroke="#FFFFFF" stroke-width="4" paint-order="stroke fill">approved findings</text>
<g id="node-planner"><rect x="119.0" y="96.0" width="210" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="224.0" y="131.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">Planner</text>
<text x="224.0" y="152.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B">Decompose research question</text>
</g>
<g id="node-researcher"><rect x="119.0" y="270.0" width="210" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="224.0" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">Researcher</text>
<text x="224.0" y="326.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B">Collect sources and evidence</text>
</g>
<g id="node-reviewer"><rect x="119.0" y="444.0" width="210" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="224.0" y="479.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">Evidence Reviewer</text>
<text x="224.0" y="500.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B">Check claims and provenance</text>
</g>
<g id="node-critic"><rect x="119.0" y="618.0" width="210" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="224.0" y="653.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">Critic</text>
<text x="224.0" y="674.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B">Find gaps and contradictions</text>
</g>
<g id="node-synthesizer"><rect x="119.0" y="792.0" width="210" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="224.0" y="827.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">Synthesizer</text>
<text x="224.0" y="848.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748B">Produce structured report</text>
</g>
</svg>
